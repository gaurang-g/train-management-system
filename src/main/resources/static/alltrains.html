<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailReserve | Find Trains & Special Schedules</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
          --neon-cyan: #06b6d4;
          --neon-indigo: #6366f1;
          --neon-emerald: #10b981;
          --neon-amber: #f59e0b;
          --neon-rose: #f43f5e;
          --bg-dark: #030712;
          --glass-card: rgba(15, 23, 42, 0.75);
          --glass-border: rgba(255, 255, 255, 0.08);
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
          background-color: var(--bg-dark);
          color: var(--text-main);
          min-height: 100vh;
          padding-bottom: 60px;
        }

        /* Navigation */
        .navbar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px 40px;
          background: rgba(15, 23, 42, 0.8);
          backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--glass-border);
          position: sticky;
          top: 0;
          z-index: 100;
        }
        .brand {
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 800;
          font-size: 1.25rem;
          color: var(--text-main);
          text-decoration: none;
        }
        .brand i { color: var(--neon-cyan); }

        /* Main Container */
        .container {
          max-width: 1200px;
          margin: 30px auto;
          padding: 0 20px;
        }

        /* Search Header Section */
        .search-panel {
          background: var(--glass-card);
          border: 1px solid var(--glass-border);
          backdrop-filter: blur(20px);
          border-radius: 20px;
          padding: 25px;
          margin-bottom: 30px;
          box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .search-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr 180px;
          gap: 15px;
          align-items: flex-end;
        }

        .input-group label {
          display: block;
          font-size: 0.75rem;
          font-weight: 700;
          color: var(--text-sub);
          text-transform: uppercase;
          margin-bottom: 8px;
          letter-spacing: 0.5px;
        }

        .input-field {
          width: 100%;
          background: rgba(3, 7, 18, 0.6);
          border: 1px solid var(--glass-border);
          border-radius: 10px;
          padding: 12px 14px;
          color: var(--text-main);
          font-size: 0.9rem;
          outline: none;
          transition: all 0.2s;
        }

        .input-field:focus {
          border-color: var(--neon-cyan);
          box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .btn-find {
          background: linear-gradient(135deg, var(--neon-cyan), var(--neon-indigo));
          border: none;
          border-radius: 10px;
          color: #fff;
          font-weight: 700;
          padding: 13px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          transition: all 0.25s ease;
        }

        .btn-find:hover {
          opacity: 0.9;
          transform: translateY(-2px);
          box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4);
        }

        /* Special Train Legend Bar */
        .legend-bar {
          display: flex;
          gap: 15px;
          margin-top: 20px;
          padding-top: 15px;
          border-top: 1px solid var(--glass-border);
          flex-wrap: wrap;
        }

        .legend-item {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 0.78rem;
          color: var(--text-sub);
        }

        /* Badges */
        .badge {
          padding: 4px 10px;
          border-radius: 6px;
          font-size: 0.7rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          display: inline-flex;
          align-items: center;
          gap: 5px;
        }

        .badge-special-holiday {
          background: rgba(245, 158, 11, 0.15);
          color: var(--neon-amber);
          border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-special-vande {
          background: rgba(6, 182, 212, 0.15);
          color: var(--neon-cyan);
          border: 1px solid rgba(6, 182, 212, 0.4);
        }

        .badge-regular {
          background: rgba(148, 163, 184, 0.1);
          color: var(--text-sub);
          border: 1px solid var(--glass-border);
        }

        /* Train Results Cards List */
        .results-count {
          margin-bottom: 15px;
          font-size: 0.9rem;
          color: var(--text-sub);
        }

        .train-card {
          background: var(--glass-card);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          padding: 22px 25px;
          margin-bottom: 20px;
          position: relative;
          overflow: hidden;
          transition: all 0.25s ease;
        }

        .train-card.is-special { border-left: 4px solid var(--neon-amber); }
        .train-card.is-vande { border-left: 4px solid var(--neon-cyan); }

        .train-card:hover {
          transform: translateY(-2px);
          border-color: rgba(255, 255, 255, 0.2);
        }

        .train-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 18px;
        }

        .train-title {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .train-name { font-size: 1.1rem; font-weight: 700; }
        .train-no { font-family: 'JetBrains Mono', monospace; color: var(--text-sub); font-size: 0.85rem; }

        .route-grid {
          display: grid;
          grid-template-columns: 1fr 1.5fr 1fr;
          align-items: center;
          margin-bottom: 20px;
        }

        .time-large { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 700; }
        .station-lbl { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        .duration-line { text-align: center; position: relative; }
        .duration-line span {
          font-size: 0.75rem;
          color: var(--text-sub);
          background: var(--bg-dark);
          padding: 2px 8px;
          border-radius: 10px;
          border: 1px solid var(--glass-border);
        }

        .line-graphic {
          height: 2px;
          background: var(--glass-border);
          width: 100%;
          margin-top: -10px;
          position: relative;
          z-index: -1;
        }

        .action-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 18px;
          padding-top: 15px;
          border-top: 1px solid var(--glass-border);
        }

        .btn-book {
          background: var(--neon-emerald);
          color: #000;
          border: none;
          padding: 9px 20px;
          border-radius: 8px;
          font-weight: 700;
          font-size: 0.85rem;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-book:hover {
          box-shadow: 0 0 15px var(--neon-emerald);
          transform: scale(1.02);
        }

        @media (max-width: 768px) {
          .search-grid { grid-template-columns: 1fr; }
          .route-grid { grid-template-columns: 1fr; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar">
    <a href="#" class="brand">
        <i class="fa-solid fa-train"></i>
        <span>RailReserve</span>
    </a>
    <span style="font-size: 0.85rem; color: var(--text-sub);">Special Train Operations Portal</span>
</nav>

<div class="container">

    <!-- Search Panel -->
    <div class="search-panel">
        <div class="search-grid">
            <div class="input-group">
                <label><i class="fa-solid fa-location-dot"></i> From Station</label>
                <input type="text" class="input-field" id="srcInput" placeholder="e.g. Mumbai">
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-location-crosshairs"></i> To Station</label>
                <input type="text" class="input-field" id="destInput" placeholder="e.g. Delhi">
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-calendar"></i> Journey Date</label>
                <input type="date" class="input-field" value="2026-08-20">
            </div>
            <button class="btn-find" onclick="findAllTrains()">
                <i class="fa-solid fa-magnifying-glass"></i> Find All Trains
            </button>
        </div>

        <!-- Indications Legend -->
        <div class="legend-bar">
            <div class="legend-item"><span class="badge badge-special-holiday"><i class="fa-solid fa-star"></i> Special Train</span> Dynamic / Festive service</div>
            <div class="legend-item"><span class="badge badge-special-vande"><i class="fa-solid fa-bolt"></i> Vande Bharat</span> Premium Express</div>
            <div class="legend-item"><span class="badge badge-regular"><i class="fa-solid fa-train"></i> Express</span> Standard Route</div>
        </div>
    </div>

    <!-- Status Header -->
    <div class="results-count" id="resultsHeader">
        Click <strong>"Find All Trains"</strong> to fetch full network schedules.
    </div>

    <!-- Dynamic Container for Trains -->
    <div id="trainsList"></div>
</div>

<script>

    const API_BASE_URL = "https://train-management-system.onrender.com/api";
    // Automatically load all trains on page load
    document.addEventListener("DOMContentLoaded", findAllTrains);

    async function findAllTrains() {
      const container = document.getElementById('trainsList');
      const header = document.getElementById('resultsHeader');

      container.style.opacity = '0.5';
      header.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Fetching trains from backend...`;

      try {
        const response = await fetch(' https://train-management-system.onrender.com/api/trains/all');

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const trains = await response.json();
        container.style.opacity = '1';

        if (!trains || trains.length === 0) {
          header.innerHTML = `No trains found in database.`;
          container.innerHTML = `<p style="text-align: center; color: var(--text-sub); padding: 40px;">No train schedules available.</p>`;
          return;
        }

        header.innerHTML = `Showing <strong>${trains.length} trains</strong> retrieved from server.`;

        // Render dynamically fetched trains
        container.innerHTML = trains.map(train => {
          // Detect train type for dynamic badge and styling
          const name = train.trainName || train.name || "Express Service";
          const isVande = name.toLowerCase().includes("vande bharat");
          const isSpecial = name.toLowerCase().includes("special") || (train.type && train.type.toLowerCase().includes("special"));

          let cardClass = "train-card";
          let badgeHtml = `<span class="badge badge-regular"><i class="fa-solid fa-train"></i> Express</span>`;

          if (isVande) {
            cardClass += " is-vande";
            badgeHtml = `<span class="badge badge-special-vande"><i class="fa-solid fa-bolt"></i> Vande Bharat</span>`;
          } else if (isSpecial) {
            cardClass += " is-special";
            badgeHtml = `<span class="badge badge-special-holiday"><i class="fa-solid fa-star"></i> Special Train</span>`;
          }

          return `
            <div class="${cardClass}">
              <div class="train-header">
                <div class="train-title">
                  <span class="train-name">${name}</span>
                  <span class="train-no">#${train.trainNumber || train.number || train.id || 'N/A'}</span>
                  ${badgeHtml}
                </div>
                <span style="font-size: 0.75rem; color: var(--text-sub);">Runs: ${train.runsOn || 'Daily'}</span>
              </div>

              <div class="route-grid">
                <div>
                  <div class="time-large">${train.departureTime || train.time || '10:00 AM'}</div>
                  <div class="station-lbl">${train.source || train.fromStation || 'Source'}</div>
                </div>
                <div class="duration-line">
                  <span>${train.duration || 'N/A'}</span>
                  <div class="line-graphic"></div>
                </div>
                <div style="text-align: right;">
                  <div class="time-large">${train.arrivalTime || '06:00 PM'}</div>
                  <div class="station-lbl">${train.destination || train.toStation || 'Destination'}</div>
                </div>
              </div>

              <div class="action-row">
                <div style="font-size: 0.85rem; color: var(--text-sub);">
                  Base Fare: <strong style="color: var(--neon-emerald);">₹${train.fare || train.price || '500'}</strong>
                </div>
                <button class="btn-book">Book Ticket</button>
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error("API Fetch Error:", error);
        container.style.opacity = '1';
        header.innerHTML = `<span style="color: var(--neon-rose);"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load trains from API</span>`;
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-sub); padding: 40px; border: 1px dashed var(--glass-border); border-radius: 12px;">
            <p>Could not connect to <code>http://localhost:8080/api/trains/all</code>.</p>
            <p style="font-size: 0.8rem; margin-top: 8px;">Ensure your backend service is running and CORS is enabled.</p>
          </div>`;
      }
    }
</script>
</body>
</html>
