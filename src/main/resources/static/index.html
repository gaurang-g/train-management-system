<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailReserve | Gateway</title>
    <style>
        :root {
            --primary-blue: #0739b8;
            --dark-bg: #060606;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            background: linear-gradient(135deg, #060606 0%, #0a192f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Main Container */
        .container {
            background-color: var(--glass-white);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            width: 800px;
            max-width: 100%;
            min-height: 500px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .login-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .register-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        /* Form Styling */
        form {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        h1 { font-weight: bold; margin: 0; color: #1e293b; margin-bottom: 15px; }

        input {
            background-color: #f1f5f9;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            outline: none;
        }

        button {
            border-radius: 20px;
            border: 1px solid var(--primary-blue);
            background-color: var(--primary-blue);
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            cursor: pointer;
            margin-top: 15px;
        }

        button:active { transform: scale(0.95); }

        /* Overlay Styling */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .overlay {
            background: linear-gradient(to right, #0739b8, #0a192f);
            color: #FFFFFF;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .overlay-right { right: 0; transform: translateX(0); }

        /* Animation  */
        .container.right-panel-active .login-container { transform: translateX(100%); }

        .container.right-panel-active .register-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .container.right-panel-active .overlay { transform: translateX(50%); }

        .container.right-panel-active .overlay-left { transform: translateX(0); }

        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .ghost {
            background-color: transparent;
            border-color: #FFFFFF;
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="form-container register-container">
        <form action="#">
            <h1>Create Account</h1>
            <input type="text" id="nameInput" placeholder="Username" />
            <input type="email" id="emailInput" placeholder="Email" />
            <input type="password" id="passwordInput" placeholder="Password" />
            <button type="button" onclick="handleSignUp(event)" >Sign Up</button>
        </form>
    </div>

    <div class="form-container login-container">
        <form action="#">
            <h1>Sign In</h1>
            <input type="text" placeholder="Username" id="username" />
            <input type="password" placeholder="Password" id="password" />
            <button type="button" onclick="handleLogin()">Login</button>
            <div id="errorMessage" style="color: #991b1b; display:none; margin-top: 10px;">Invalid credentials</div>
        </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with RailReserve, please login with your personal info</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>  <h1 style="color: green;">New to RailReserve?</h1></h1>
                <p>Register to book your train tickets across India</p>
                <button class="ghost" id="signUp">Register Now</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Visual Toggle Logic
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => {
        container.classList.add("right-panel-active");
    });

    signInButton.addEventListener('click', () => {
        container.classList.remove("right-panel-active");
    });


    function handleLogin() {
        console.log("Login triggered");
        // Your logic from the previous page goes here
    }
</script>

</body>
</html>
<script>

    //------------------function to handle singUp------------------------//

async function handleSignUp(event) {
// This prevents the error you saw in the console
if (event) {
    event.preventDefault();
}


const nameInput = document.getElementById('nameInput');
const emailInput = document.getElementById('emailInput');
const passInput = document.getElementById('passwordInput');


if (!nameInput || !emailInput || !passInput) {
    alert("Form inputs not found! Check your HTML IDs.");
    return;
}


const userData = {
    username: nameInput.value,
    fullName: nameInput.value,
    email: emailInput.value,
    password: passInput.value,
    role: "USER"
};

try {
    const response = await fetch('https://train-management-system.onrender.com/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
    });

    if (response.ok) {
        alert("Account created! Try logging in.");
        container.classList.remove("right-panel-active"); // Switch to login
    } else {
        const errorText = await response.text();
        alert("Registration failed: " + errorText);
    }
} catch (error) {
    console.error("Network error:", error);
    alert("Server is not responding. Check if Spring Boot is running.");
}
}

    //-------------------------Function to handle login-----------------------------------------//

async function handleLogin() {
const user = document.getElementById('username').value;
const pass = document.getElementById('password').value;

try {
    // Ensure the URL matches exactly what is in your @PostMapping
    const response = await fetch(`https://train-management-system.onrender.com/api/auth/login?username=${user}&password=${pass}`, {
        method: 'POST'
    });

    if (response.ok) {
        const data = await response.json();

        // We check for the specific JSON status you wrote in AuthController
        if (data.status === "success") {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', user);

            // Redirect to your dashboard
            window.location.href = "find.html";
        }
    } else {
        const errorText = await response.text();
        alert("Login Failed: " + errorText);
    }
} catch (err) {
    console.error("CORS or Connection Error:", err);
    alert("Cannot connect to server. Check if Spring Boot is running and CORS is allowed.");
}
}
</script>
</body>
</html>
